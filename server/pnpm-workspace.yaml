# pnpm 11 build-script permissions.
# better-sqlite3 is a native module and must run its install/build script
# to compile (or fetch the prebuilt) better_sqlite3.node binding.
# esbuild (transitive dep of tsx/vitest) ships its own native binary too.
allowBuilds:
  better-sqlite3: true
  esbuild: true

# Neue Paketversionen erst nach 1 Tag übernehmen (wie Dependabot-Cooldown
# und pnpm ≥ 11 als Default; sonst lehnt dessen --frozen-lockfile ab).
minimumReleaseAge: 1440
