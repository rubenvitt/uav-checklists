# Deploy compose — pulls the prebuilt image from GHCR (no source checkout / build
# needed on the host). This is the easy path for production.
#
#   1. Copy the env template and fill it in:
#        cp .env.example .env   &&   $EDITOR .env
#   2. Grab the clamd config (only this file is needed from the repo besides .env):
#        mkdir -p clamav
#        curl -fsSL -o clamav/clamd.conf \
#          https://raw.githubusercontent.com/rubenvitt/uav-checklists/main/server/clamav/clamd.conf
#   3. Start it:
#        docker compose -f docker-compose.deploy.yml up -d
#
# Pin a specific version instead of `latest` in production:
#   IMAGE_TAG=1.0.0 docker compose -f docker-compose.deploy.yml up -d
#
# The named volume `uav-sign-data` persists the SQLite DB, the Ed25519 signing
# key, and the PDF archive across restarts/upgrades. BACK IT UP.
# `uav-clamav-db` caches the ClamAV virus database so it is not re-downloaded.
services:
  signatures:
    image: ghcr.io/rubenvitt/uav-checklists-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${PORT:-8787}:8787"
    # All config comes from .env (copy .env.example). clamd host/port are fixed
    # below since they reference the sibling service, not the host environment.
    env_file: .env
    environment:
      DB_PATH: "/app/data/signatures.db"
      SIGNING_KEY_PATH: "/app/data/signing-key.pem"
      ARCHIVE_DIR: "/app/data/archive"
      CLAMAV_HOST: "clamav"
      CLAMAV_PORT: "3310"
    volumes:
      - uav-sign-data:/app/data
    depends_on:
      # `service_started` (not `service_healthy`) so the API comes up immediately
      # rather than blocking on clamd's first-boot virus-DB download; the scanner
      # fails closed (503) until clamd is ready.
      clamav:
        condition: service_started

  clamav:
    image: clamav/clamav:latest
    restart: unless-stopped
    volumes:
      - uav-clamav-db:/var/lib/clamav
      - ./clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Generous: freshclam's initial virus-DB download can take several minutes.
      start_period: 300s

volumes:
  uav-sign-data:
  uav-clamav-db:
