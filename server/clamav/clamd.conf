# clamd configuration for the UAV signature backend.
#
# The stream limits are set ABOVE the backend's 25 MB request-body cap on
# purpose: clamd silently returns OK (without scanning) for streams that exceed
# StreamMaxLength/MaxFileSize, so these must stay larger than what the API
# accepts, or large uploads would pass unscanned.
LogTime yes
DatabaseDirectory /var/lib/clamav

# Listen for INSTREAM scans over TCP (used by the backend).
TCPSocket 3310
TCPAddr 0.0.0.0

# Local socket so the bundled clamdcheck.sh healthcheck works.
LocalSocket /tmp/clamd.sock

StreamMaxLength 32M
MaxFileSize 32M
MaxScanSize 64M
MaxThreads 4
ExitOnOOM yes
