name: Checks

# Single required status check for main (ruleset): waits for whatever checks
# this PR triggered (path-filtered workflows, CodeQL, Cloudflare, CodeRabbit …)
# and fails if one of them fails. Lets auto-merge work without requiring
# checks that only run for some PRs.

on:
  pull_request:

permissions:
  checks: read

jobs:
  all-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: poseidon/wait-for-status-checks@v0.7.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          delay: 30
          interval: 15
